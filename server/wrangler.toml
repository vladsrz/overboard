# The game server: one small "room" per group of friends, awake only while they
# are in it. It also hands out the game's own files (built into ./site), so the
# game is playable at the server's address. Deploy with `npm run deploy` from this folder.
name = "overboard"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./site"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# the front desk for quick play: knows which public room has space
[[durable_objects.bindings]]
name = "DESK"
class_name = "Desk"

# the free plan only allows this kind of room
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Desk"]

# play statistics: one small database of matches and daily visitors
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Stats"]

[vars]
# Pages allowed to connect, by the start of their address. Anything on your own
# machine or home network is always allowed, for testing.
ALLOWED_ORIGINS = "https://overboard.overboard-server.workers.dev,https://vladsrz.github.io,https://overboard-game.vercel.app"
