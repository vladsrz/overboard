<!doctype html>
<!-- Play statistics from everyone, read from the game server. It needs the server's
     statistics key, which is typed once and kept in this browser only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Overboard: players</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; color: #14211f; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  h2 { margin: 30px 0 8px; font-size: 15px; }
  p { margin: 4px 0; max-width: 60em; }
  .muted { color: #5c6b68; }
  table { border-collapse: collapse; margin-top: 4px; }
  th, td { padding: 4px 14px 4px 0; text-align: right; border-bottom: 1px solid #e3e6e5; white-space: nowrap; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; border-bottom: 2px solid #14211f; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; border: 1.5px solid #14211f; vertical-align: -1px; }
  button, input { margin: 10px 8px 0 0; padding: 7px 12px; font: inherit; }
  input { width: 26em; max-width: 90vw; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>Overboard: players</h1>
<p class="muted" id="about">Everyone's play, as the game server has counted it. No names or addresses are kept.</p>
<form id="door"><input id="key" type="password" placeholder="statistics key" autocomplete="off"><button>Show</button></form>
<button id="export" hidden>Export matches as JSON</button><button id="forget" hidden>Forget the key on this device</button>
<div id="out"></div>
<script src="../js/sim.js"></script>
<script src="../js/cast.js"></script>
<script src="../js/net.js"></script>
<script src="players.js"></script>
</body>
</html>
